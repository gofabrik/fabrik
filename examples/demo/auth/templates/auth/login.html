{{ define "title" }}Log in{{ end }}

{{ define "content" }}
  {{ template "_nav.html" . }}
  <h1>Log in</h1>
  {{ with .Error }}<p class="error">{{ . }}</p>{{ end }}
  <form method="post" action="/login">
    <label>Username <input name="username" value="{{ .Form.Value "username" }}" autocomplete="username"></label>
    {{ with .Form.Error "username" }}<span class="error">{{ . }}</span>{{ end }}
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    {{ with .Form.Error "password" }}<span class="error">{{ . }}</span>{{ end }}
    <button type="submit">Log in</button>
  </form>
{{ end }}
