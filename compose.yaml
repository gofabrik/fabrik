services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: proto
      POSTGRES_DB: proto
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: proto
      MYSQL_DATABASE: proto
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pproto"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: proto
      MARIADB_DATABASE: proto
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 10
